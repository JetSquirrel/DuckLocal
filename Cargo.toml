[package]
name = "ducklocal"
version = "0.1.0"
edition = "2021"
description = "A local-first DuckDB desktop client built with GPUI Kit"
license = "Apache-2.0"
keywords = ["duckdb", "sql", "database", "client", "gui"]
categories = ["database", "gui"]

[dependencies]
gpui-kit = { version = "0.6.0", features = ["tree-sitter-languages"] }
duckdb = { version = "1", features = ["bundled"] }
smol = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlformat = "0.3"
lsp-types = "0.97"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1"

[profile.dev.package."*"]
opt-level = 3
