[package]
name = "ducklocal"
version = "0.1.0"
edition = "2021"
description = "A local-first workspace for querying and exploring your data, built natively on DuckDB"
license = "Apache-2.0"
repository = "https://github.com/JetSquirrel/DuckLocal"
homepage = "https://github.com/JetSquirrel/DuckLocal"
readme = "README.md"
keywords = ["duckdb", "sql", "parquet", "csv", "analytics"]
categories = ["database", "gui"]

[dependencies]
# One dependency graph: the UI toolkit, the scriptable-shell runtime and the
# component catalog all come from the same pinned revision. Mixing the
# crates.io release with the Git one would put two incompatible copies of
# `gpui-base` in the build.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "fb26e617da3add2ce2ac92a2ccc1a64bc8343135" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "fb26e617da3add2ce2ac92a2ccc1a64bc8343135" }
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "fb26e617da3add2ce2ac92a2ccc1a64bc8343135" }
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
calamine = { version = "0.36", features = ["dates"] }
smol = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlformat = "0.3"
lsp-types = "0.97"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
hmac = "0.12"
sha2 = "0.10"
quick-xml = { version = "0.36", features = ["serialize"] }

[dev-dependencies]
rust_xlsxwriter = "0.99"

# `gpui-shell` scripts run on the QuickJS fork the toolkit pins; the crates.io
# `rquickjs` would be a second, incompatible copy of the same crate.
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-kit", rev = "fb26e617da3add2ce2ac92a2ccc1a64bc8343135" }

# A self-contained binary, small over fast: the heavy lifting happens inside
# DuckDB's own C++ build, so the Rust code optimizes for size.
[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
strip = true             # Strip symbols
panic = "abort"          # Smaller panic handling
codegen-units = 1        # Better optimization

[profile.dev.package."*"]
opt-level = 3
