[package]
name = "ducklocal"
version = "0.1.2"
edition = "2021"
description = "A local-first workspace for querying and exploring your data, built natively on DuckDB"
license = "Apache-2.0"
repository = "https://github.com/JetSquirrel/DuckLocal"
homepage = "https://github.com/JetSquirrel/DuckLocal"
readme = "README.md"
keywords = ["duckdb", "sql", "parquet", "csv", "analytics"]
categories = ["database", "gui"]

# The Quick Look preview's engine lives beside the app, sharing its lockfile
# and build cache; a plain `cargo build` still builds only the app.
[workspace]
members = ["quicklook"]

[dependencies]
# One dependency graph: the UI toolkit, the scriptable-shell runtime and the
# component catalog all come from the same release tag. Mixing the
# crates.io release with the Git one would put two incompatible copies of
# `gpui-base` in the build.
# `tree-sitter-sql`: the SQL editor and the SQL in `.dash` heredocs are the only
# code DuckLocal highlights, so it links that one grammar rather than the set.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["tree-sitter-sql"] }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
gpui-component-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
calamine = { version = "0.36", features = ["dates"] }
smol = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlformat = "0.3"
lsp-types = "0.97"
lsp-server = "0.10"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
# Map tiles: the same `image` GPUI decodes with, only the formats tile
# servers send.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = { version = "0.36", features = ["serialize"] }
unicode-width = "0.2"
# Profiler: every macro is a no-op and nothing is compiled in unless a
# `hotpath*` feature is on (`cargo run --release --features hotpath,hotpath-alloc`).
hotpath = "0.28"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
# `ducklocal __scroll-bench`: scroll the results grid in a real window and
# report GPUI's own frame timings. Never part of a release build.
scroll-bench = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console"] }

[build-dependencies]
# Also supports cross-compiling to Windows; resources are required, not optional.
embed-resource = "3.0.11"

[dev-dependencies]
rust_xlsxwriter = "0.99"
# Same release tag as the build dependency (see above); the extra feature only
# joins the test build, where `gpui_kit::test` and `#[gpui_kit::test]` live.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0", features = ["test-support"] }

# `gpui-shell` scripts run on the QuickJS fork the toolkit pins; the crates.io
# `rquickjs` would be a second, incompatible copy of the same crate.
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-kit", rev = "0c830f4d257e69fdd17200650533ab4ca9a40cc0" }

# Fast over small. The opt-level reaches DuckDB's C++ too: libduckdb-sys
# builds it with the `cc` crate, which passes Cargo's level on to the
# compiler, so "z" meant `-Oz` for every scan, filter and aggregate loop in
# the engine, and for gpui's layout and text shaping. The binary is larger;
# queries and frames are faster.
[profile.release]
opt-level = 3
lto = true               # Link-time optimization
strip = true             # Strip symbols
panic = "abort"          # Smaller panic handling
codegen-units = 1        # Better optimization

# Optional smaller distribution, without compiling DuckDB's hot C++ loops
# for size. The normal release remains the performance-oriented default.
[profile.compact]
inherits = "release"
opt-level = "s"

[profile.compact.package.libduckdb-sys]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
