# The oldest macOS DuckLocal runs on, for every macOS build: the app, the
# Quick Look extension (scripts/build-quicklook.sh links it for the same
# release) and the DuckDB C++ that libduckdb-sys compiles through the `cc`
# crate. Unset, `cc` targets the macOS of the machine that builds, so a
# release built on a newer Mac carried code its declared minimum cannot
# load. It matches LSMinimumSystemVersion in assets/Info.plist; other
# platforms ignore it.
[env]
MACOSX_DEPLOYMENT_TARGET = "12.0"

# duckdb-rs 1.20000.0 bundles DuckDB at the v2.0.0 tag (d54cbbe3df) but
# packaged it as `v2.0.0-dev88614`. DuckDB takes a dev version's extensions
# from a directory named after the commit, which extensions.duckdb.org does
# not have, so every INSTALL failed with a 404. The sources only define these
# when they are not set already. `duckdb_contract::bundled_duckdb_is_v2_0_0`
# fails when the bundled commit moves, which is when this should go.
CXXFLAGS = '-DDUCKDB_VERSION="v2.0.0" -DDUCKDB_PATCH_VERSION="0"'
