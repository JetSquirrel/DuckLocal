name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # The app is macOS-only: bundle.sh ships a .app and package-macos.sh
    # turns it into a signed, notarized dmg. There is no Windows or Linux
    # artifact to build yet.
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          # A throwaway keychain for this run: importing into the runner's
          # login keychain would leave a distribution private key behind
          # for whatever runs next.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # codesign runs non-interactively here; without a partition list
          # the keychain would pop a GUI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/"//g')

          rm -f "$CERTIFICATE_PATH"

          echo "NOTARY_KEY=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package, sign and notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          scripts/package-macos.sh \
            target/aarch64-apple-darwin/release/ducklocal \
            ducklocal-macos-arm64.dmg \
            "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ducklocal-macos-arm64.dmg
          path: ducklocal-macos-arm64.dmg

  release:
    needs: build
    # No `if: always()`: a macOS job that failed to sign or notarize must
    # fail the whole release, not ship a half-empty one.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ducklocal-macos-arm64.dmg
          path: artifacts

      - name: Locate the dmg
        id: dmg
        run: |
          # download-artifact@v8 decides at download time whether to unpack
          # the artifact, and its "download all" mode adds a per-artifact
          # subdirectory on top of that — so the dmg can end up either at
          # artifacts/<name> or artifacts/<name>/<name>. Find it instead of
          # assuming, and print what is there when it is missing.
          set -euo pipefail
          FOUND=$(find artifacts -type f -name 'ducklocal-macos-arm64.dmg' | head -1)
          if [ -z "$FOUND" ]; then
            echo "::error::no dmg under artifacts/"
            find artifacts -type f | head -20
            exit 1
          fi

          # A zip header here means the download skipped decompression and
          # named the archive after the artifact: publishing that would ship
          # a 31 MB zip with a .dmg extension.
          if [ "$(head -c 2 "$FOUND" | tr -d '\0')" = "PK" ]; then
            echo "::error::$FOUND is a zip archive, not a dmg"
            exit 1
          fi

          echo "found $FOUND"
          file "$FOUND" || true
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: DuckLocal ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.dmg.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
