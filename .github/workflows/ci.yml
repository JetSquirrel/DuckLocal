name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The app bundles as a macOS .app; test where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Before the build, because a mixed revision fails as a wall of trait
      # errors that names no cause, and this names it in a second.
      - name: Check dependency pinning
        run: ./scripts/check-deps.sh

      - name: Run tests
        run: cargo test --locked
