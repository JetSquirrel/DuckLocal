name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Only the latest revision of a branch/PR needs a full native build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app bundles as a macOS .app; test where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Before the build, because a mixed revision fails as a wall of trait
      # errors that names no cause, and this names it in a second.
      - name: Check dependency pinning
        run: ./scripts/check-deps.sh

      - name: Run tests
        run: cargo test --locked

  build:
    # The release ships Linux and Windows builds too; nothing else compiles
    # them, so a change that breaks either shows up here, on the pull request,
    # rather than on a release tag. Linux builds only; Windows runs the tests
    # as well, since its paths (drive letters, `\`, no `$HOME`) are where the
    # macOS run cannot catch a mistake.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # PDBs and C++ debug information are expensive to compile, link and
      # cache on Windows. Keep the existing dependency optimization levels;
      # this changes CI debug information only, never the release profile.
      - name: Configure Windows CI debug information
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_PROFILE_DEV_DEBUG=0" >> $env:GITHUB_ENV
          "CARGO_PROFILE_TEST_DEBUG=0" >> $env:GITHUB_ENV

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The packages gpui-kit's own CI installs for its Linux build.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libvulkan1

      - name: Build
        if: runner.os == 'Linux'
        run: cargo build --locked

      # cargo test builds the app for the CLI/LSP integration tests too.
      # Building it separately first repeats GPUI compilation with different
      # test-support features. Report compilation separately from execution.
      - name: Compile Windows tests
        if: runner.os == 'Windows'
        run: cargo test --locked --no-run

      - name: Run tests
        if: runner.os == 'Windows'
        run: "cargo test --locked -- --skip perf_probe::"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        run: python scripts/check-windows.py target/debug/ducklocal.exe
