name: Redirect the old docs address

# The docs moved to ducklocal.app/docs/ (source: JetSquirrel/ducklocal-site).
# This repository's GitHub Pages site, jetsquirrel.github.io/DuckLocal/, now
# only redirects each old page to its new address.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pages-redirects.sh'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued run must not cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Write the redirect pages
        run: scripts/pages-redirects.sh target/pages-redirects

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/pages-redirects'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
